<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Ricambi Auto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.8rem; opacity: 0.6; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.utente {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agente {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .msg.progress {
      align-self: flex-start;
      background: #f8f9fa;
      color: #555;
      font-size: 0.82rem;
      padding: 8px 14px;
      border-left: 3px solid #aaa;
      max-width: 90%;
    }
    .msg.progress .step-list {
      margin-top: 6px;
      padding-left: 4px;
    }
    .msg.progress .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
    }
    .msg.progress .step.done { color: #27ae60; }
    .msg.progress .step.active { color: #e67e22; font-weight: 500; }
    .msg.progress .step.pending { color: #aaa; }
    .msg.errore {
      align-self: flex-start;
      background: #fff0f0;
      color: #c0392b;
      border-left: 3px solid #e74c3c;
    }
    /* Piano agente */
    .msg.piano {
      align-self: flex-start;
      background: #fffbea;
      color: #333;
      border-left: 3px solid #f39c12;
      max-width: 85%;
      font-size: 0.88rem;
    }
    .msg.piano .piano-header {
      font-weight: 600;
      color: #e67e22;
      margin-bottom: 6px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .csv-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: #27ae60;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.82rem;
    }
    .csv-btn:hover { background: #219a52; }

    #input-area {
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input-area textarea {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      font-size: 0.92rem;
      font-family: inherit;
      max-height: 120px;
      outline: none;
    }
    #input-area textarea:focus { border-color: #1a1a2e; }

    #send-btn {
      padding: 10px 20px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      white-space: nowrap;
    }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #16213e; }

    #reset-btn {
      padding: 10px 14px;
      background: transparent;
      color: #999;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    #reset-btn:hover { color: #e74c3c; border-color: #e74c3c; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Agente Ricambi Auto</h1>
    <span>Elring · Corteco · Valeo · AutoDoc · WooCommerce</span>
  </div>
</header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="msg" rows="1" placeholder="Cerca un ricambio, chiedi un prezzo, crea un prodotto..."></textarea>
  <button id="reset-btn" title="Nuova conversazione">Reset</button>
  <button id="send-btn">Invia</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const msgInput = document.getElementById('msg');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');

  const SESSION_ID = 'session_' + Math.random().toString(36).slice(2);
  let progressSteps = [];

  function addMsg(text, tipo) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addMsgHtml(html, tipo) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  // Rileva se un testo è un messaggio di piano (contiene passi numerati)
  function isPianoMsg(text) {
    return /PIAN[OI]|^\d+\.\s/im.test(text) && text.includes('\n');
  }

  function renderProgress(testo) {
    // Aggiungi step alla lista progressi
    const stepMatch = testo.match(/^(▶|✓|✗)\s+(.+)$/);
    if (stepMatch) {
      progressSteps.push({ icon: stepMatch[1], testo: stepMatch[2] });
    } else {
      progressSteps.push({ icon: '⋯', testo });
    }
    return progressSteps;
  }

  function buildProgressHtml(steps) {
    if (steps.length === 0) return '';
    const items = steps.map(s => {
      const cls = s.icon === '✓' ? 'done' : s.icon === '✗' ? 'pending' : 'active';
      return `<div class="step ${cls}">${s.icon} ${escHtml(s.testo)}</div>`;
    }).join('');
    return `<div class="step-list">${items}</div>`;
  }

  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function invia() {
    const testo = msgInput.value.trim();
    if (!testo) return;

    addMsg(testo, 'utente');
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.disabled = true;
    progressSteps = [];

    let progressDiv = null;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messaggio: testo, session_id: SESSION_ID }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let evento;
          try { evento = JSON.parse(raw); } catch { continue; }

          if (evento.tipo === 'progress') {
            const steps = renderProgress(evento.testo);
            if (!progressDiv) {
              progressDiv = document.createElement('div');
              progressDiv.className = 'msg progress';
              chat.appendChild(progressDiv);
            }
            progressDiv.innerHTML = buildProgressHtml(steps);
            chat.scrollTop = chat.scrollHeight;

          } else if (evento.tipo === 'risposta') {
            if (progressDiv) progressDiv.remove();

            // Rileva messaggi di piano e mostrali con stile dedicato
            const testo_r = evento.testo;
            if (isPianoMsg(testo_r)) {
              const pianoDiv = document.createElement('div');
              pianoDiv.className = 'msg piano';
              pianoDiv.innerHTML = `<div class="piano-header">Piano di esecuzione</div>${escHtml(testo_r).replace(/\n/g, '<br>')}`;
              chat.appendChild(pianoDiv);
            } else {
              let html = escHtml(testo_r).replace(/\n/g, '<br>');
              if (evento.csv_disponibile) {
                html += `<br><br><a class="csv-btn" href="/api/download/${evento.csv_disponibile}" download>Scarica CSV</a>`;
              }
              addMsgHtml(html, 'agente');
            }
            chat.scrollTop = chat.scrollHeight;

          } else if (evento.tipo === 'errore') {
            if (progressDiv) progressDiv.remove();
            addMsg('Errore: ' + evento.testo, 'errore');
          }
        }
      }
    } catch (err) {
      addMsg('Errore di connessione: ' + err.message, 'errore');
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  sendBtn.addEventListener('click', invia);

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      invia();
    }
  });

  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  resetBtn.addEventListener('click', async () => {
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID }),
    });
    chat.innerHTML = '';
    addMsg('Conversazione resettata.', 'progress');
  });
</script>

</body>
</html>
