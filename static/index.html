<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Ricambi Auto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; }
    header span { font-size: 0.75rem; opacity: 0.6; }

    /* Tabs */
    #tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: transparent;
      font-size: 0.88rem;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .tab-btn.active {
      color: #1a1a2e;
      border-bottom-color: #1a1a2e;
      font-weight: 600;
    }
    .tab-btn:hover:not(.active) { background: #f5f5f5; }

    /* Layout principale */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* PANNELLO CHAT */
    #panel-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.utente {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agente {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .msg.progress {
      align-self: flex-start;
      background: #f8f9fa;
      color: #555;
      font-size: 0.8rem;
      padding: 8px 12px;
      border-left: 3px solid #aaa;
      max-width: 90%;
    }
    .msg.progress .step { display:flex; align-items:center; gap:8px; padding:2px 0; }
    .msg.progress .step.done { color: #27ae60; }
    .msg.progress .step.active { color: #e67e22; font-weight:500; }
    .msg.progress .step.pending { color: #aaa; }
    .msg.errore {
      align-self: flex-start;
      background: #fff0f0;
      color: #c0392b;
      border-left: 3px solid #e74c3c;
    }
    .msg.piano {
      align-self: flex-start;
      background: #fffbea;
      color: #333;
      border-left: 3px solid #f39c12;
      max-width: 85%;
      font-size: 0.85rem;
    }
    .msg.piano .piano-header {
      font-weight:600; color:#e67e22; margin-bottom:5px;
      font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em;
    }

    .csv-btn {
      display:inline-block; margin-top:8px; padding:5px 12px;
      background:#27ae60; color:#fff; border-radius:6px;
      text-decoration:none; font-size:0.8rem;
    }
    .csv-btn:hover { background:#219a52; }

    #input-area {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #input-area textarea {
      flex:1; padding:9px 13px; border:1px solid #ccc;
      border-radius:10px; resize:none; font-size:0.9rem;
      font-family:inherit; max-height:120px; outline:none;
    }
    #input-area textarea:focus { border-color:#1a1a2e; }
    #send-btn {
      padding:9px 18px; background:#1a1a2e; color:#fff;
      border:none; border-radius:10px; cursor:pointer; font-size:0.9rem; white-space:nowrap;
    }
    #send-btn:disabled { background:#aaa; cursor:not-allowed; }
    #send-btn:hover:not(:disabled) { background:#16213e; }
    #reset-btn {
      padding:9px 12px; background:transparent; color:#999;
      border:1px solid #ddd; border-radius:10px; cursor:pointer; font-size:0.8rem;
    }
    #reset-btn:hover { color:#e74c3c; border-color:#e74c3c; }

    /* PANNELLO OBIETTIVI */
    #panel-obiettivi {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      flex-direction: column;
      gap: 12px;
    }
    #panel-obiettivi.visible { display: flex; }

    .ob-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .ob-header h2 { font-size: 1rem; color: #1a1a2e; }

    /* Oggi card */
    .oggi-card {
      background: #1a1a2e;
      color: #fff;
      border-radius: 12px;
      padding: 14px 16px;
    }
    .oggi-card h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; margin-bottom: 10px; }
    .oggi-task {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .oggi-task-item {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .oggi-task-item .task-num {
      width: 22px; height: 22px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
    }
    .oggi-task-item .task-info { flex: 1; min-width: 0; }
    .oggi-task-item .task-titolo { font-size: 0.88rem; font-weight: 500; }
    .oggi-task-item .task-ob { font-size: 0.75rem; opacity: 0.65; margin-top: 2px; }
    .oggi-task-item .task-badge {
      font-size: 0.7rem; padding: 2px 7px;
      border-radius: 10px; background: rgba(255,255,255,0.15); white-space: nowrap;
    }
    .oggi-vuoto { text-align: center; opacity: 0.7; font-size: 0.88rem; padding: 10px 0; }

    /* Gamification row */
    .gam-row {
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      font-size: 0.82rem;
    }
    .gam-item { display: flex; align-items: center; gap: 5px; color: #444; }
    .gam-item strong { color: #1a1a2e; }
    .gam-achievement {
      margin-left: auto; font-size: 0.75rem; color: #e67e22;
      background: #fff8ee; padding: 3px 8px; border-radius: 8px;
      border: 1px solid #f39c12;
    }

    /* Statistiche */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .stat-card .num { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; }
    .stat-card .lbl { font-size: 0.72rem; color: #888; margin-top: 2px; }

    /* Obiettivi lista */
    .ob-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .ob-title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }
    .ob-title { font-size: 0.95rem; font-weight: 600; color: #1a1a2e; flex: 1; }
    .ob-meta { font-size: 0.75rem; color: #888; margin-bottom: 10px; }
    .ob-badge {
      font-size: 0.7rem; padding: 2px 8px;
      border-radius: 10px; white-space: nowrap; font-weight: 500;
    }
    .ob-badge.alta { background: #ffe0e0; color: #c0392b; }
    .ob-badge.media { background: #fff3cd; color: #856404; }
    .ob-badge.bassa { background: #d4edda; color: #155724; }
    .ob-scadenza { font-size: 0.72rem; margin-top: 2px; }
    .ob-scadenza.urgente { color: #e74c3c; font-weight: 600; }
    .ob-scadenza.ok { color: #888; }

    /* Task list */
    .task-list { display: flex; flex-direction: column; gap: 6px; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .task-item .task-check {
      width: 18px; height: 18px;
      border: 2px solid #ccc;
      border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .task-item.completato .task-check { background: #27ae60; border-color: #27ae60; color: #fff; }
    .task-item.completato .task-testo { text-decoration: line-through; color: #aaa; }
    .task-item.in_corso { border-left: 3px solid #f39c12; }
    .task-item.bloccato { border-left: 3px solid #e74c3c; }
    .task-item.da_fare { border-left: 3px solid #ddd; }
    .task-testo { flex: 1; }
    .task-note { font-size: 0.72rem; color: #888; margin-top: 2px; }
    .task-days { font-size: 0.7rem; color: #888; white-space: nowrap; }
    .task-days.urgente { color: #e74c3c; font-weight: 600; }

    .ob-empty { font-size: 0.82rem; color: #aaa; text-align: center; padding: 8px 0; }

    .refresh-btn {
      padding: 6px 12px; background: transparent; color: #666;
      border: 1px solid #ddd; border-radius: 8px; cursor: pointer;
      font-size: 0.78rem; font-family: inherit;
    }
    .refresh-btn:hover { background: #f0f2f5; }

    /* PANNELLO SESSIONI */
    #panel-sessioni {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      flex-direction: column;
      gap: 12px;
    }
    #panel-sessioni.visible { display: flex; }

    .sess-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .sess-header h2 { font-size: 1rem; color: #1a1a2e; }

    .sess-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .sess-data {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sess-data .sess-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e8f4fd;
      color: #1a73e8;
    }
    .sess-riepilogo {
      font-size: 0.88rem;
      color: #333;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .sess-empty {
      text-align: center;
      color: #aaa;
      font-size: 0.88rem;
      padding: 40px 0;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Agente Ricambi Auto</h1>
    <span>Elring · Corteco · Valeo · AutoDoc · WooCommerce</span>
  </div>
</header>

<div id="tabs">
  <button class="tab-btn active" onclick="showTab('chat')">Chat</button>
  <button class="tab-btn" onclick="showTab('obiettivi')">Obiettivi</button>
  <button class="tab-btn" onclick="showTab('sessioni')">Sessioni</button>
</div>

<div id="main">

  <!-- CHAT -->
  <div id="panel-chat">
    <div id="chat"></div>
    <div id="input-area">
      <textarea id="msg" rows="1" placeholder="Cerca un ricambio, chiedi un prezzo, crea un prodotto..."></textarea>
      <button id="reset-btn" title="Nuova conversazione">Reset</button>
      <button id="send-btn">Invia</button>
    </div>
  </div>

  <!-- OBIETTIVI -->
  <div id="panel-obiettivi">

    <div class="ob-header">
      <h2>Obiettivi & Task</h2>
      <button class="refresh-btn" onclick="caricaObiettivi()">Aggiorna</button>
    </div>

    <!-- Oggi -->
    <div class="oggi-card">
      <h3>Focus di oggi</h3>
      <div class="oggi-task" id="oggi-list">
        <div class="oggi-vuoto">Caricamento...</div>
      </div>
    </div>

    <!-- Gamification -->
    <div class="gam-row" id="gam-row">
      <div class="gam-item">🔥 Streak <strong id="gam-streak">-</strong> giorni</div>
      <div class="gam-item">⭐ <strong id="gam-xp">-</strong> XP</div>
      <div class="gam-item">✅ <strong id="gam-tasks">-</strong> task completati</div>
      <div class="gam-achievement" id="gam-next" style="display:none"></div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="num" id="stat-ob-attivi">-</div><div class="lbl">Obiettivi attivi</div></div>
      <div class="stat-card"><div class="num" id="stat-task-sospeso">-</div><div class="lbl">Task in sospeso</div></div>
      <div class="stat-card"><div class="num" id="stat-task-fatti">-</div><div class="lbl">Completati</div></div>
    </div>

    <!-- Lista obiettivi -->
    <div id="ob-list"></div>

  </div>

  <!-- SESSIONI -->
  <div id="panel-sessioni">
    <div class="sess-header">
      <h2>Log Sessioni</h2>
      <button class="refresh-btn" onclick="caricaSessioni()">Aggiorna</button>
    </div>
    <div id="sess-list">
      <div class="sess-empty">Caricamento...</div>
    </div>
  </div>

</div>

<script>
  // ==========================================
  // TAB NAVIGATION
  // ==========================================
  function showTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active',
        (i === 0 && tab === 'chat') ||
        (i === 1 && tab === 'obiettivi') ||
        (i === 2 && tab === 'sessioni'));
    });
    document.getElementById('panel-chat').style.display = tab === 'chat' ? 'flex' : 'none';
    document.getElementById('panel-obiettivi').classList.toggle('visible', tab === 'obiettivi');
    document.getElementById('panel-sessioni').classList.toggle('visible', tab === 'sessioni');
    if (tab === 'obiettivi') caricaObiettivi();
    if (tab === 'sessioni') caricaSessioni();
  }

  // ==========================================
  // OBIETTIVI
  // ==========================================
  async function caricaObiettivi() {
    try {
      const [obRes, oggiRes, statRes, gamRes] = await Promise.all([
        fetch('/api/obiettivi').then(r => r.json()),
        fetch('/api/obiettivi/oggi').then(r => r.json()),
        fetch('/api/obiettivi/statistiche').then(r => r.json()),
        fetch('/api/gamification').then(r => r.json()),
      ]);
      renderOggi(oggiRes);
      renderStats(statRes);
      renderGamification(gamRes);
      renderObiettivi(obRes.obiettivi || []);
    } catch (e) {
      console.error('Errore caricamento obiettivi', e);
    }
  }

  function renderGamification(data) {
    document.getElementById('gam-streak').textContent = data.streak_giorni ?? 0;
    document.getElementById('gam-xp').textContent = data.punteggio_totale ?? 0;
    document.getElementById('gam-tasks').textContent = data.task_totali_completati ?? 0;
    const nextEl = document.getElementById('gam-next');
    if (data.prossimo_achievement) {
      const p = data.prossimo_achievement;
      nextEl.textContent = `Prossimo: ${p.titolo} (mancano ${p.mancano})`;
      nextEl.style.display = '';
    } else {
      nextEl.style.display = 'none';
    }
  }

  function renderOggi(data) {
    const el = document.getElementById('oggi-list');
    const tasks = data.task_oggi || [];
    if (!tasks.length) {
      el.innerHTML = '<div class="oggi-vuoto">' + (data.messaggio || 'Nessun task urgente oggi.') + '</div>';
      return;
    }
    el.innerHTML = tasks.map((t, i) => {
      const giorni = t.giorni_rimanenti;
      const scad = giorni != null
        ? (giorni <= 0 ? 'Scaduto!' : giorni === 1 ? 'Domani' : `${giorni}g`)
        : '';
      return `<div class="oggi-task-item">
        <div class="task-num">${i + 1}</div>
        <div class="task-info">
          <div class="task-titolo">${escHtml(t.task)}</div>
          <div class="task-ob">${escHtml(t.obiettivo)}</div>
        </div>
        ${scad ? `<div class="task-badge">${scad}</div>` : ''}
      </div>`;
    }).join('');
  }

  function renderStats(data) {
    document.getElementById('stat-ob-attivi').textContent = data.obiettivi?.in_corso ?? '-';
    document.getElementById('stat-task-sospeso').textContent = data.task?.in_sospeso ?? '-';
    document.getElementById('stat-task-fatti').textContent = data.task?.completati ?? '-';
  }

  function renderObiettivi(obiettivi) {
    const el = document.getElementById('ob-list');
    if (!obiettivi.length) {
      el.innerHTML = '<div class="ob-card ob-empty">Nessun obiettivo attivo.<br>Chiedi all\'agente di crearne uno.</div>';
      return;
    }
    el.innerHTML = obiettivi.map(ob => {
      const giorni = ob.giorni_rimanenti;
      const scadClass = giorni != null && giorni <= 7 ? 'urgente' : 'ok';
      const scadTxt = ob.scadenza
        ? (giorni != null
            ? (giorni <= 0 ? 'Scaduto!' : `${giorni} giorni rimasti`)
            : ob.scadenza)
        : '';

      const taskHtml = ob.task && ob.task.length
        ? ob.task.map(t => {
            const tGiorni = t.giorni_rimanenti;
            const tScad = tGiorni != null
              ? (tGiorni <= 0 ? 'Scaduto' : tGiorni <= 3 ? `${tGiorni}g ⚠️` : `${tGiorni}g`)
              : '';
            const check = t.stato === 'completato' ? '✓' : '';
            return `<div class="task-item ${t.stato}">
              <div class="task-check">${check}</div>
              <div style="flex:1;min-width:0">
                <div class="task-testo">${escHtml(t.titolo)}</div>
                ${t.note ? `<div class="task-note">${escHtml(t.note)}</div>` : ''}
              </div>
              ${tScad ? `<div class="task-days ${tGiorni != null && tGiorni <= 2 ? 'urgente' : ''}">${tScad}</div>` : ''}
            </div>`;
          }).join('')
        : '<div class="ob-empty">Nessun task — chiedi all\'agente di aggiungerli.</div>';

      return `<div class="ob-card">
        <div class="ob-title-row">
          <div class="ob-title">${escHtml(ob.titolo)}</div>
          <span class="ob-badge ${ob.priorita}">${ob.priorita}</span>
        </div>
        ${ob.descrizione ? `<div class="ob-meta">${escHtml(ob.descrizione)}</div>` : ''}
        ${scadTxt ? `<div class="ob-scadenza ${scadClass}">${scadTxt}</div>` : ''}
        <div class="task-list" style="margin-top:10px">${taskHtml}</div>
      </div>`;
    }).join('');
  }

  // ==========================================
  // CHAT
  // ==========================================
  const chatEl = document.getElementById('chat');
  const msgInput = document.getElementById('msg');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');

  const SESSION_ID = 'session_' + Math.random().toString(36).slice(2);
  let progressSteps = [];

  function addMsg(text, tipo) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addMsgHtml(html, tipo) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;
    div.innerHTML = html;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function isPianoMsg(text) {
    return /PIAN[OI]|^\d+\.\s/im.test(text) && text.includes('\n');
  }

  function renderProgress(testo) {
    const stepMatch = testo.match(/^(▶|✓|✗)\s+(.+)$/);
    if (stepMatch) progressSteps.push({ icon: stepMatch[1], testo: stepMatch[2] });
    else progressSteps.push({ icon: '⋯', testo });
    return progressSteps;
  }

  function buildProgressHtml(steps) {
    if (!steps.length) return '';
    return '<div class="step-list">' + steps.map(s => {
      const cls = s.icon === '✓' ? 'done' : s.icon === '✗' ? 'pending' : 'active';
      return `<div class="step ${cls}">${s.icon} ${escHtml(s.testo)}</div>`;
    }).join('') + '</div>';
  }

  function escHtml(t) {
    if (!t) return '';
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function invia() {
    const testo = msgInput.value.trim();
    if (!testo) return;

    addMsg(testo, 'utente');
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.disabled = true;
    progressSteps = [];

    let progressDiv = null;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messaggio: testo, session_id: SESSION_ID }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let evento;
          try { evento = JSON.parse(raw); } catch { continue; }

          if (evento.tipo === 'progress') {
            const steps = renderProgress(evento.testo);
            if (!progressDiv) {
              progressDiv = document.createElement('div');
              progressDiv.className = 'msg progress';
              chatEl.appendChild(progressDiv);
            }
            progressDiv.innerHTML = buildProgressHtml(steps);
            chatEl.scrollTop = chatEl.scrollHeight;

          } else if (evento.tipo === 'risposta') {
            if (progressDiv) progressDiv.remove();
            const testo_r = evento.testo;
            if (isPianoMsg(testo_r)) {
              const pianoDiv = document.createElement('div');
              pianoDiv.className = 'msg piano';
              pianoDiv.innerHTML = `<div class="piano-header">Piano di esecuzione</div>${escHtml(testo_r).replace(/\n/g, '<br>')}`;
              chatEl.appendChild(pianoDiv);
            } else {
              let html = escHtml(testo_r).replace(/\n/g, '<br>');
              if (evento.csv_disponibile) {
                html += `<br><br><a class="csv-btn" href="/api/download/${evento.csv_disponibile}" download>Scarica CSV</a>`;
              }
              addMsgHtml(html, 'agente');
            }
            chatEl.scrollTop = chatEl.scrollHeight;
            // Aggiorna obiettivi in background dopo ogni risposta
            caricaObiettivi();

          } else if (evento.tipo === 'errore') {
            if (progressDiv) progressDiv.remove();
            addMsg('Errore: ' + evento.testo, 'errore');
          }
        }
      }
    } catch (err) {
      addMsg('Errore di connessione: ' + err.message, 'errore');
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  sendBtn.addEventListener('click', invia);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); invia(); }
  });
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });
  resetBtn.addEventListener('click', async () => {
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID }),
    });
    chatEl.innerHTML = '';
    addMsg('Conversazione resettata.', 'progress');
  });

  // ==========================================
  // SESSIONI
  // ==========================================
  async function caricaSessioni() {
    try {
      const res = await fetch('/api/sessioni');
      const data = await res.json();
      renderSessioni(data.sessioni || []);
    } catch (e) {
      console.error('Errore caricamento sessioni', e);
      document.getElementById('sess-list').innerHTML = '<div class="sess-empty">Errore nel caricamento.</div>';
    }
  }

  function renderSessioni(sessioni) {
    const el = document.getElementById('sess-list');
    if (!sessioni.length) {
      el.innerHTML = '<div class="sess-empty">Nessuna sessione salvata.<br>I riepiloghi vengono creati quando resetti la chat.</div>';
      return;
    }
    el.innerHTML = sessioni.map(s => {
      const d = new Date(s.data);
      const dataStr = d.toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const msgTot = (s.messaggi_utente || 0) + (s.messaggi_agente || 0);
      return `<div class="sess-card">
        <div class="sess-data">
          ${dataStr}
          <span class="sess-badge">${msgTot} messaggi</span>
        </div>
        <div class="sess-riepilogo">${escHtml(s.riepilogo || 'Nessun riepilogo disponibile.')}</div>
      </div>`;
    }).join('');
  }

  // Carica obiettivi in background all'avvio
  caricaObiettivi();
</script>

</body>
</html>
