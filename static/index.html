<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Ricambi Auto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.8rem; opacity: 0.6; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.utente {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agente {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .msg.progress {
      align-self: flex-start;
      background: #f8f9fa;
      color: #666;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-left: 3px solid #aaa;
    }
    .msg.errore {
      align-self: flex-start;
      background: #fff0f0;
      color: #c0392b;
      border-left: 3px solid #e74c3c;
    }

    .csv-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: #27ae60;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.82rem;
    }
    .csv-btn:hover { background: #219a52; }

    #input-area {
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input-area textarea {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      font-size: 0.92rem;
      font-family: inherit;
      max-height: 120px;
      outline: none;
    }
    #input-area textarea:focus { border-color: #1a1a2e; }

    #send-btn {
      padding: 10px 20px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      white-space: nowrap;
    }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #16213e; }

    #reset-btn {
      padding: 10px 14px;
      background: transparent;
      color: #999;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    #reset-btn:hover { color: #e74c3c; border-color: #e74c3c; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Agente Ricambi Auto</h1>
    <span>Elring · Corteco · Valeo · AutoDoc · WooCommerce</span>
  </div>
</header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="msg" rows="1" placeholder="Cerca un ricambio, chiedi un prezzo, crea un prodotto..."></textarea>
  <button id="reset-btn" title="Nuova conversazione">Reset</button>
  <button id="send-btn">Invia</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const msgInput = document.getElementById('msg');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');

  const SESSION_ID = 'session_' + Math.random().toString(36).slice(2);

  function addMsg(text, tipo) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addMsgHtml(html, tipo) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function invia() {
    const testo = msgInput.value.trim();
    if (!testo) return;

    addMsg(testo, 'utente');
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.disabled = true;

    let progressDiv = null;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messaggio: testo, session_id: SESSION_ID }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let evento;
          try { evento = JSON.parse(raw); } catch { continue; }

          if (evento.tipo === 'progress') {
            if (!progressDiv) {
              progressDiv = addMsg(evento.testo, 'progress');
            } else {
              progressDiv.textContent = evento.testo;
              chat.scrollTop = chat.scrollHeight;
            }
          } else if (evento.tipo === 'risposta') {
            if (progressDiv) progressDiv.remove();
            let html = evento.testo.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            if (evento.csv_disponibile) {
              html += `\n\n<a class="csv-btn" href="/api/download/${evento.csv_disponibile}" download>Scarica CSV</a>`;
            }
            addMsgHtml(html.replace(/\n/g, '<br>'), 'agente');
          } else if (evento.tipo === 'errore') {
            if (progressDiv) progressDiv.remove();
            addMsg('Errore: ' + evento.testo, 'errore');
          }
        }
      }
    } catch (err) {
      addMsg('Errore di connessione: ' + err.message, 'errore');
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  sendBtn.addEventListener('click', invia);

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      invia();
    }
  });

  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  resetBtn.addEventListener('click', async () => {
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID }),
    });
    chat.innerHTML = '';
    addMsg('Conversazione resettata.', 'progress');
  });
</script>

</body>
</html>
